
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #mensaje {
      position: fixed;
      top: 15px;
      left: 10px;
      right: 10px;
      padding: 15px;
      background: white;
      color: black;
      border-radius: 12px;
      text-align: center;
      z-index: 1000;
    }
  </style>
</head>

<body>
  <div id="mensaje">
    Apuntá la cámara a una de las 6 tarjetas
  </div>


<button id="botonWeb" disabled
  style="
    display: none;
    position: fixed;
    top: 120px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 999999;
    background: #333333;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 15px 20px;
    font-size: 16px;
    white-space: nowrap;
  ">
  Página web en preparación
</button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    

	
<a-entity id="tarjeta0" mindar-image-target="targetIndex: 0">
  
<a-gltf-model
  src="./Desafio3.glb"
  position="0 0 0.1"
  rotation="0 0 0"
  scale="1 1 1">
</a-gltf-model>
</a-entity>

    <a-entity id="tarjeta1" mindar-image-target="targetIndex: 1"></a-entity>
    <a-entity id="tarjeta2" mindar-image-target="targetIndex: 2"></a-entity>
    <a-entity id="tarjeta3" mindar-image-target="targetIndex: 3"></a-entity>
    <a-entity id="tarjeta4" mindar-image-target="targetIndex: 4">
  <a-gltf-model
    src="./Desafio1.glb"
    position="0 0 0.1"
    rotation="0 0 0"
    scale="1 1 1">
  </a-gltf-model>
</a-entity>
    <a-entity id="tarjeta5" mindar-image-target="targetIndex: 5">
<a-gltf-model
    src="./Desafio2.glb"
    position="0 0 0.1"
    rotation="0 0 0"
    scale="1 1 1">
  </a-gltf-model>
</a-entity>

  </a-scene>

  <script>
    window.addEventListener("load", function() {
      const mensaje = document.getElementById("mensaje");
const botonWeb = document.getElementById("botonWeb");
      for (let i = 0; i < 6; i++) {
        const tarjeta = document.getElementById("tarjeta" + i);

        
tarjeta.addEventListener("targetFound", function() {
botonWeb.style.display =
  (i >= 1 && i <= 3) ? "block" : "none";
  if (i === 1) {
    mensaje.textContent = "Cadena de ochos - Página web en preparación";
  } else if (i === 2) {
    mensaje.textContent = "Hoja de palma - Página web en preparación";
  } else if (i === 3) {
    mensaje.textContent = "Pipa - Página web en preparación";
  } else {
    mensaje.textContent = "¡Imagen " + (i + 1) + " reconocida!";
  }
});


        tarjeta.addEventListener("targetLost", function() {
          mensaje.textContent = "Apuntá a una tarjeta";
	botonWeb.style.display = "none";
        });
      }
    });
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #mensaje {
      position: fixed;
      top: 15px;
      left: 10px;
      right: 10px;
      padding: 15px;
      background: white;
      color: black;
      border-radius: 12px;
      text-align: center;
      z-index: 1000;
    }
  </style>
</head>

<body>
 
<div id="mensaje">
  <span id="textoMensaje">
    Apuntá la cámara a una de las 6 tarjetas
  </span>

  <button id="botonWeb" disabled
    style="
      display: none;
      margin: 12px auto 0;
      padding: 12px 18px;
      background: #333333;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
    ">
    Abrir página web
  </button>
</div>


  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    

	
<a-entity id="tarjeta0" mindar-image-target="targetIndex: 0">
  
<a-gltf-model
  src="./Desafio3.glb"
  position="0 0 0.1"
  rotation="0 0 0"
  scale="1 1 1">
</a-gltf-model>
</a-entity>

    <a-entity id="tarjeta1" mindar-image-target="targetIndex: 1"></a-entity>
    <a-entity id="tarjeta2" mindar-image-target="targetIndex: 2"></a-entity>
    <a-entity id="tarjeta3" mindar-image-target="targetIndex: 3"></a-entity>
    <a-entity id="tarjeta4" mindar-image-target="targetIndex: 4">
  <a-gltf-model
    src="./Desafio1.glb"
    position="0 0 0.1"
    rotation="0 0 0"
    scale="1 1 1">
  </a-gltf-model>
</a-entity>
    <a-entity id="tarjeta5" mindar-image-target="targetIndex: 5">
<a-gltf-model
    src="./Desafio2.glb"
    position="0 0 0.1"
    rotation="0 0 0"
    scale="1 1 1">
  </a-gltf-model>
</a-entity>

  </a-scene>

  <script>
    window.addEventListener("load", function() {
      
const mensaje = document.getElementById("textoMensaje");

const botonWeb = document.getElementById("botonWeb");
const enlacesWeb = {
  1: "https://florcogo11.wixsite.com/huellas-africanas",
  2: "https://florcogo11.wixsite.com/huellas-africanas/blank-1",
  3: "https://florcogo11.wixsite.com/huellas-africanas/blank-3"
};
      for (let i = 0; i < 6; i++) {
        const tarjeta = document.getElementById("tarjeta" + i);

        
tarjeta.addEventListener("targetFound", function() {
  if (i === 1) {
    mensaje.textContent = "Cadena de ochos";
    botonWeb.style.display = "block";
    botonWeb.disabled = false;
    botonWeb.textContent = "Abrir inicio";
    botonWeb.onclick = function() {
      window.location.href = enlacesWeb[1];
    };
  } else if (i === 2) {
    mensaje.textContent = "Hoja de palma";
    botonWeb.style.display = "block";
    botonWeb.disabled = false;
    botonWeb.textContent = "Abrir página interactiva";
    botonWeb.onclick = function() {
      window.location.href = enlacesWeb[2];
    };
  } else if (i === 3) {
    mensaje.textContent = "Pipa";
    botonWeb.style.display = "block";
    botonWeb.disabled = false;
    botonWeb.textContent = "Abrir datos del museo";
    botonWeb.onclick = function() {
      window.location.href = enlacesWeb[3];
    };
  } else {
    mensaje.textContent = "¡Imagen " + (i + 1) + " reconocida!";
    botonWeb.style.display = "none";
    botonWeb.disabled = true;
  }
});

        tarjeta.addEventListener("targetLost", function() {
          mensaje.textContent = "Apuntá a una tarjeta";
	botonWeb.style.display = "none";
	botonWeb.disabled = true;
  	botonWeb.onclick = null;

        });
      }
    });
  </script>
</body>
</html>
